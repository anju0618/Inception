listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES

# ログインしたユーザーを自分のホームディレクトリ以下に閉じ込める(他ユーザーの領域を見せない)
chroot_local_user=YES
allow_writeable_chroot=YES

# userlist_file に載っているユーザーだけログインを許可する
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# パッシブモードのデータ転送用ポート範囲(docker-compose.ymlで同じ範囲を公開している)
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

seccomp_sandbox=NO
