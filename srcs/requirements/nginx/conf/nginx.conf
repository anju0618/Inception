server {
    # 443番のみ、TLSでのみ待ち受ける(HTTPの80番は一切listenしない = 唯一の入口)
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMAIN_NAME_PLACEHOLDER;

    # TLSv1.2/1.3以外は拒否する
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    root /var/www/html;      # wordpress_dataボリュームと共有しているパス
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;   # WordPressのパーマリンク用フォールバック
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;             # php-fpm(wordpressコンテナ)へ転送
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;                                 # .htaccess等への直接アクセスを禁止
    }
}
