services:

  # NGINX: インフラへの唯一の入口。443番だけを公開し、TLSv1.2/1.3でしか喋らない。
  nginx:
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}   # ビルド時に証明書のCN/server_nameへ渡す
    image: nginx
    container_name: nginx
    restart: on-failure                # クラッシュ時は自動再起動
    ports:
      - "443:443"                      # ホストに公開するのはこの1ポートだけ
    volumes:
      - wordpress_data:/var/www/html   # WordPressの静的ファイルを直接配信するため共有
    networks:
      - inception
    depends_on:
      - wordpress

  # WordPress + php-fpm。NGINXは同居させない。ホストへポートは公開しない(内部の9000番のみ)。
  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: on-failure
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    environment:
      # 非機密設定は.envから、パスワードは値そのものではなく secrets のファイルパスを渡す
      DOMAIN_NAME: ${DOMAIN_NAME}
      WORDPRESS_DB_HOST: mariadb                       # コンテナ名でそのままDNS解決できる
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TITLE: ${WORDPRESS_TITLE}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}    # admin/administratorを含まない管理者名
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/credentials
      WORDPRESS_USER: ${WORDPRESS_USER}                # 一般ユーザー(2人目)
      WORDPRESS_USER_EMAIL: ${WORDPRESS_USER_EMAIL}
      WP_USER_PASSWORD_FILE: /run/secrets/wp_users_password
      REDIS_HOST: ${REDIS_HOST}
    secrets:
      - db_password
      - credentials
      - wp_users_password

  # MariaDB。NGINXは同居させない。ホストへポートは公開しない(コンテナ間通信のみ)。
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: on-failure
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password

  # --- ここからボーナス ---

  # Redis: WordPressのオブジェクトキャッシュ用。ホストへは公開しない。
  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis
    container_name: redis
    restart: on-failure
    networks:
      - inception

  # FTP: WordPressのボリュームをファイル転送用に公開。21番+パッシブモード用のポート範囲。
  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    restart: on-failure
    ports:
      - "21:21"
      - "21000-21010:21000-21010"      # パッシブモードのデータ転送用ポート範囲
    volumes:
      - wordpress_data:/home/ftpuser/wordpress   # WordPressと同じボリュームを共有
    networks:
      - inception
    environment:
      FTP_USER: ${FTP_USER}
      FTP_PASSWORD_FILE: /run/secrets/ftp_password
    secrets:
      - ftp_password

  # Adminer: MariaDBを見るための1ファイルのDB管理ツール。
  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: on-failure
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - inception

  # 静的サイト: PHPを使わない(Python http.server製)ボーナス用サイト。
  static-site:
    build:
      context: ./requirements/bonus/static-site
    image: static-site
    container_name: static-site
    restart: on-failure
    ports:
      - "${STATIC_SITE_PORT}:8081"
    networks:
      - inception

  # backup: 自由選択のボーナス。cronでMariaDBを定期的にダンプする。
  backup:
    build:
      context: ./requirements/bonus/backup
    image: backup
    container_name: backup
    restart: on-failure
    volumes:
      - backup_data:/backups
    networks:
      - inception
    depends_on:
      - mariadb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    secrets:
      - db_password

# コンテナ同士を繋ぐ専用ブリッジネットワーク(network: host / --link は使用しない)
networks:
  inception:
    driver: bridge

# 名前付きボリューム。driver_optsでホストの/home/<login>/data配下に実体を固定している
# (bind mountではなく、あくまで名前付きボリュームとしてホストパスに紐付けている点がポイント)
volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/backups

# Docker secrets。実体は secrets/*.txt (gitignore対象)。コンテナ内には
# /run/secrets/<name> というファイルとしてのみ見える(環境変数には出ない)。
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  wp_users_password:
    file: ../secrets/wp_users_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
